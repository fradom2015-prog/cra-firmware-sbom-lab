# Controlli del server dell'app d'aste: tipi, lint, test su PostgreSQL e Redis veri,
# vulnerabilità note nelle dipendenze e analisi statica di sicurezza (CodeQL).
name: aste-server

on:
  push:
    branches: [main]
    paths: ["aste/server/**", "aste/Dockerfile", "aste/deploy/**", ".github/workflows/aste-server.yml"]
  pull_request:
    paths: ["aste/server/**", "aste/Dockerfile", "aste/deploy/**", ".github/workflows/aste-server.yml"]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: aste/server

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aste/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/aste_test
      - name: Vulnerabilità note nelle dipendenze di produzione
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Immagine Docker (server + web app)
        run: docker build --build-arg PUBLIC_URL=https://aste.example.com -t aste:ci ..
      - name: Configurazione di deploy
        run: cd ../deploy && cp .env.example .env && DOMAIN=aste.example.com POSTGRES_PASSWORD=x docker compose config --quiet

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          source-root: aste/server
      - uses: github/codeql-action/analyze@v3
