# Controlli dell'app (Expo): tipi, lint, test, vulnerabilità e compilazione della versione web.
# Le build iOS/Android si fanno con EAS (vedi aste/app/README.md).
name: aste-app

on:
  push:
    branches: [main]
    paths: ["aste/app/**", ".github/workflows/aste-app.yml"]
  pull_request:
    paths: ["aste/app/**", ".github/workflows/aste-app.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: aste/app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aste/app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Vulnerabilità nelle dipendenze di produzione
        run: npm run audit
      - name: Compilazione web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.com
