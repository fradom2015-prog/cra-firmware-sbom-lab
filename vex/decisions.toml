# --- OpenSSL: elaborazione delle certificate policy ----------------------------------------
# Secondo gli advisory OpenSSL, CVE-2023-0464/0465/0466 si manifestano solo se l'applicazione
# abilita la verifica delle policy X.509, disattivata di default.

[[decision]]
cve = "CVE-2023-0464"
component = "openssl"
state = "not_affected"
justification = "requires_configuration"
detail = "Richiede la verifica delle policy X.509 (opzione -policy o X509_V_FLAG_POLICY_CHECK), disattivata di default in OpenSSL e non abilitata nella configurazione di fabbrica del firmware. Da rivalutare se un servizio la abilita."
author = "Francesco Terracciano"
date = "2026-09-24"

[[decision]]
cve = "CVE-2023-0465"
component = "openssl"
state = "not_affected"
justification = "requires_configuration"
detail = "Come CVE-2023-0464: si applica solo con la verifica delle policy attiva."
author = "Francesco Terracciano"
date = "2026-09-24"

[[decision]]
cve = "CVE-2023-0466"
component = "openssl"
state = "not_affected"
justification = "requires_configuration"
detail = "Come CVE-2023-0464: X509_VERIFY_PARAM_add0_policy non abilita da sola il controllo, il problema esiste solo per applicazioni che contano su quella funzione."
author = "Francesco Terracciano"
date = "2026-09-24"

# --- Samba 3.6: funzioni che non esistono in questa versione -------------------------------
# samba36-server installa solo smbd, nmbd, smbpasswd e samba_multicall.
# Non c'è un Active Directory Domain Controller né un KDC Kerberos.

[[decision]]
cve = "CVE-2022-45141"
component = "samba"
state = "not_affected"
justification = "code_not_present"
detail = "Riguarda Samba come AD DC. Samba 3.6 (samba36-server) non include il ruolo di Domain Controller Active Directory."
author = "Francesco Terracciano"
date = "2026-09-24"

[[decision]]
cve = "CVE-2022-2031"
component = "samba"
state = "not_affected"
justification = "code_not_present"
detail = "Riguarda KDC e kpasswd di Samba AD DC, assenti in samba36-server."
author = "Francesco Terracciano"
date = "2026-09-24"

[[decision]]
cve = "CVE-2020-1472"
component = "samba"
state = "not_affected"
justification = "requires_configuration"
detail = "Zerologon colpisce Samba solo quando fa da domain controller (domain logons = yes). Il template /etc/samba/smb.conf.template del firmware configura 'security = user' senza 'domain logons': il dispositivo non è un DC. Resta nel catalogo KEV: da rivalutare se il ruolo DC viene abilitato."
author = "Francesco Terracciano"
date = "2026-09-24"

# --- Confermata: SambaCry ------------------------------------------------------------------

[[decision]]
cve = "CVE-2017-7494"
component = "samba"
state = "exploitable"
response = ["update", "workaround_available"]
detail = "smbd è installato e Samba 3.6.25 è nel range vulnerabile. /etc/config/samba abilita le share 'homes', scrivibili dagli utenti autenticati: la precondizione dell'exploit (share scrivibile) è soddisfatta. Mitigazione immediata: 'nt pipe support = no' in smb.conf. Soluzione: rimuovere samba36 o passare a ksmbd o a Samba 4 aggiornato."
author = "Francesco Terracciano"
date = "2026-09-24"


