# Decisioni di analisi per il documento VEX.
#
# Ogni voce chiude o classifica una CVE trovata dal confronto SBOM/NVD, con una motivazione
# verificabile sul firmware analizzato. Stati ammessi (CycloneDX 1.6):
#   not_affected   il componente c'è ma la vulnerabilità non è sfruttabile (serve una justification)
#   false_positive la corrispondenza è sbagliata
#   exploitable    confermata: va corretta
#   in_triage      in analisi (default per tutto ciò che non è qui)
#   resolved       corretta in una versione successiva del firmware
#
# Firmware: ASUS RT-AC58U, ImmortalWrt 18.06-k5.4 (build 2023-03-09)
# SHA-256: d9cd6f6c11ea7125aa17c420087a16b8ca1923bca079660dbce390d1167d4b6d

# --- OpenSSH: nel firmware ci sono solo sftp-server e il client sftp -------------------------
# Verifica: usr/lib/opkg/info/openssh-sftp-*.list contiene solo /usr/bin/sftp e sftp-server.
# /usr/bin/ssh e /usr/bin/scp sono link simbolici a /usr/sbin/dropbear. Non esistono sshd,
# ssh-agent, ssh-add né il client ssh di OpenSSH.

[[decision]]
cve = "CVE-2024-6387"
component = "openssh"
state = "not_affected"
justification = "code_not_present"
detail = "regreSSHion riguarda sshd. Il firmware usa Dropbear come server SSH; di OpenSSH sono installati solo sftp-server e il client sftp."
author = "Francesco Terracciano"
date = "2026-09-24"

[[decision]]
cve = "CVE-2023-38408"
component = "openssh"
state = "not_affected"
justification = "code_not_present"
detail = "Vulnerabilità nel supporto PKCS#11 di ssh-agent: ssh-agent non è presente nel firmware."
author = "Francesco Terracciano"
date = "2026-09-24"

[[decision]]
cve = "CVE-2023-28531"
component = "openssh"
state = "not_affected"
justification = "code_not_present"
detail = "Riguarda ssh-add, che non è presente nel firmware."
author = "Francesco Terracciano"
date = "2026-09-24"

[[decision]]
cve = "CVE-2023-51385"
component = "openssh"
state = "not_affected"
justification = "code_not_present"
detail = "Command injection nel client ssh di OpenSSH. /usr/bin/ssh punta a Dropbear (dbclient), non a OpenSSH."
author = "Francesco Terracciano"
date = "2026-09-24"

